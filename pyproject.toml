[project]
name = "escuela-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.0",
    "passlib>=1.7.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlacodegen>=4.0.4",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[project.scripts]
escuela_api = "app.main:app"
